<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Hall — v6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,500;1,300&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 /* smoke-blackened timber, carved bone, and one lamp */
 --ink:#15110d;      /* soot — the roof above you            */
 --p1:#1e1813;       /* timber — a plank                     */
 --p2:#282019;       /* grain — a plank you can press        */
 --line:#0c0a07;     /* the groove cut between them          */
 --edge:#3a2f24;     /* the lit upper edge of a cut          */
 --bone:#e9dcc0;     /* antler, incised                      */
 --dim:#93866f;      /* ash                                  */
 --patina:#7f9d73;   /* aged bronze                          */
 --rust:#b05a34;     /* iron oxide                           */
 --frost:#7290a6;    /* woad-dyed cloth                      */
 --gold:#e0a53c;     /* tallow flame                         */
 --amber:#d8a24a;
 --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Safari on iOS will not deliver a click from a plain div unless it looks
   clickable to it. Every tap target says so explicitly. */
[data-slot],[data-sect],[data-flow],[data-un],[data-act],[data-pick],[data-pickoff]{
 cursor:pointer;touch-action:manipulation}
html,body{margin:0;padding:0;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--bone);font-family:var(--serif);font-size:14.5px;line-height:1.45;
 -webkit-font-smoothing:antialiased;
 background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),
  repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 9px)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:600;font-size:15px;margin:0 0 9px;
 font-variant:small-caps;letter-spacing:.07em;color:var(--bone)}
/* pressed into the wood rather than laid on it */
button{font-family:var(--serif);font-size:13px;font-variant:small-caps;letter-spacing:.06em;
 background:var(--p2);color:var(--bone);border:0;border-top:1px solid var(--edge);
 box-shadow:inset 0 1px 0 rgba(0,0,0,.5),inset 0 -1px 0 rgba(0,0,0,.35);
 padding:9px 14px;border-radius:0;min-height:46px;touch-action:manipulation;
 -webkit-user-select:none;user-select:none;cursor:pointer}
button:active:not(:disabled){background:var(--gold);color:#15110d;border-top-color:var(--gold)}
button:disabled{opacity:.32}
button > *{pointer-events:none}
.pick{position:relative;min-height:66px}
.pick:active{transform:scale(.985)}
button.take{background:var(--patina);border-top-color:#9ab88e;color:#15110d;font-weight:600}
button.take:active:not(:disabled){background:#9ab88e;color:#15110d}
button.swap{background:transparent;box-shadow:none;border:0;border-bottom:1px dashed var(--edge);
 color:var(--dim);min-height:30px;padding:3px 7px;font-size:10.5px;letter-spacing:.04em;flex:0 0 auto}
button.swap.arm{color:var(--gold);border-bottom-color:var(--gold)}
.q.ready{border-left-color:var(--patina)}
.give{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:62%}
.give button{min-height:46px;padding:8px 14px}
.row{min-height:8px}
.row > button, .row > span > button{margin-left:4px}
.q .row{gap:12px}
@media (pointer:coarse){ button{min-height:46px} .slot{min-height:52px;padding:9px 10px} }

/* fixed top: always visible */
#top{position:sticky;top:0;z-index:20;background:#120e0a;border-bottom:2px solid var(--line);box-shadow:0 1px 0 var(--edge);
 padding:8px 12px calc(8px + env(safe-area-inset-top,0px));padding-top:8px}
#res{display:flex;flex-wrap:wrap;gap:3px 13px;font-family:var(--mono);font-size:12px;line-height:1.55}
#res .it{white-space:nowrap}
#res .it.up b{color:var(--patina)}
#res .it.dn b{color:var(--rust)}
#res .it.full{border-bottom:1px solid var(--gold)}
#res .ar{font-size:9px;opacity:.85}
#res .st{color:var(--dim);flex-basis:100%;font-size:10.5px}
#res::-webkit-scrollbar{display:none}
#res b{color:var(--dim);font-weight:400}
#res .it{white-space:nowrap}
#res .it.up b{color:var(--patina)}
#res .it.dn b{color:var(--rust)}
#res .it.full{border-bottom:1px solid var(--gold)}
#res .ar{font-size:9px;opacity:.85}
#res .it.up{color:var(--patina)}
#tabs{display:flex;gap:4px;margin-top:7px}
#tabs button{flex:1;padding:8px 1px;font-size:11.5px;min-height:48px;letter-spacing:.03em}
#tabs button.on{background:var(--gold);color:#15110d;border-top-color:#f0bd5e;font-weight:600}
#tabs button .dot{display:inline-block;width:6px;height:6px;border-radius:0;transform:rotate(45deg);background:var(--gold);vertical-align:middle;margin-left:3px}
/* the tab you are on is gold itself — a gold dot or mark on it cannot be seen at all */
#tabs button.on .dot{background:#15110d}
#tabs button .mk{display:block;font-size:8.5px;line-height:1;letter-spacing:.1em;
 color:var(--gold);margin-bottom:2px}
#tabs button.on .mk{color:#15110d}
main{padding:12px calc(14px + env(safe-area-inset-right,0px)) 60px calc(14px + env(safe-area-inset-left,0px));max-width:640px;margin:0 auto}
/* a plank, with the groove cut above it and the lamplight on its upper edge */
.card{background:var(--p1);border:0;border-top:1px solid var(--edge);border-radius:0;
 padding:12px 13px 13px;margin-bottom:10px;box-shadow:0 -2px 0 var(--line),0 2px 5px rgba(0,0,0,.4)}
.card.act{border-top-color:var(--gold);box-shadow:0 -2px 0 var(--line),0 0 0 1px rgba(224,165,60,.18)}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hd[data-sect]{min-height:44px;align-items:center;margin:-4px -2px 0;padding:0 2px}
.hd[data-sect]:active{opacity:.6}
.hd .nm{font-size:14.5px;font-weight:600;font-variant:small-caps;letter-spacing:.06em}
.hd .lv{font-family:var(--mono);font-size:11.5px;color:var(--gold)}
.sub{font-size:11.5px;color:var(--dim);font-family:var(--mono);margin-top:2px;line-height:1.4}
.bar{height:11px;background:#0f0c09;border-radius:0;overflow:hidden;margin-top:9px;position:relative;
 box-shadow:inset 0 1px 2px rgba(0,0,0,.7),0 1px 0 var(--edge)}
.bar i{display:block;height:100%;min-width:3px;background:linear-gradient(90deg,#5c7688,#9fb9c9);transition:width .09s linear;border-radius:0}
.bar.xp i{background:linear-gradient(90deg,#a8762a,#e0a53c)}
.bar.sm{height:7px;margin-top:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pick{padding:9px 10px;text-align:left;line-height:1.25;min-height:52px}
.pick b{display:block;font-family:var(--serif);font-size:13.5px;font-weight:600;font-variant:small-caps;letter-spacing:.05em}
.pick small{font-family:var(--mono);font-size:10px;color:var(--dim)}
.pick.on{background:var(--gold);color:#15110d;border-top-color:#f0bd5e}
.pick.on small{color:#3a2c12}
.pick.want small{color:var(--rust)}
.pick .who{display:block;font-family:var(--mono);font-size:9.5px;color:var(--patina);margin-top:2px}
.pick .who.idle{color:var(--rust)}
.pick.on .who{color:#3a2c12}
.row{display:flex;justify-content:space-between;gap:9px;align-items:center;padding:3px 0;font-size:13px}
.note{font-size:12.5px;color:var(--dim);font-family:var(--serif);font-style:italic;line-height:1.45}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
.slot{border:1px dashed var(--edge);border-radius:0;padding:7px 9px;font-size:11.5px;font-family:var(--mono);color:var(--dim);min-height:46px;background:rgba(0,0,0,.18)}
.slot.f{border-style:solid;border-color:var(--gold);color:var(--bone);background:rgba(224,165,60,.07)}
.slot em{display:block;font-style:normal;color:var(--dim);font-size:9.5px;text-transform:uppercase;letter-spacing:.09em}
.q{border-left:2px solid var(--gold);padding:6px 0 6px 9px;margin-bottom:7px}
.q.done{border-left-color:var(--patina);opacity:.5}
.q .t{font-size:13px} .q .r{font-size:10.5px;color:var(--gold);font-family:var(--mono)}
.q .p{font-size:10.5px;color:var(--dim);font-family:var(--mono)}
.tag{display:inline-block;font-size:9.5px;font-family:var(--mono);padding:2px 6px;border:1px solid var(--edge);border-radius:0;color:var(--dim);margin-right:4px}
.tag.amber{border-color:var(--amber);color:var(--amber)}
#log{max-height:220px;overflow-y:auto;font-family:var(--serif);font-size:13px;line-height:1.5}
#log div{padding:3px 0;border-bottom:1px solid rgba(58,47,36,.5)}
#log .g{color:var(--patina)} #log .b{color:var(--frost)} #log .y{color:var(--gold)}
#away{position:fixed;inset:0;z-index:60;background:rgba(10,14,19,.86);display:flex;align-items:center;
 justify-content:center;padding:18px}
#away .in{background:var(--p1);border:0;border-top:2px solid var(--gold);border-radius:0;padding:17px 16px 15px;box-shadow:0 6px 24px rgba(0,0,0,.7);
 max-width:460px;width:100%;max-height:82vh;overflow-y:auto}
#away h2{font-size:17px;margin-bottom:4px}
#away .li{padding:6px 0;border-bottom:1px solid #232c36;font-size:13px}
#away .li:last-of-type{border-bottom:0}
#away .li b{font-family:var(--mono);font-weight:500;color:var(--bone)}
#intro{position:fixed;inset:0;z-index:70;background:#120e0a;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#intro .in{max-width:430px;width:100%}
#intro pre{font-family:var(--mono);font-size:11px;line-height:1.15;color:var(--edge);margin:0 0 4px;text-align:center;white-space:pre}
#intro pre .f{color:var(--gold)}
#intro h1{font-family:var(--serif);font-variant:small-caps;letter-spacing:.14em;font-size:21px;font-weight:600;
 text-align:center;margin:14px 0 2px;color:var(--bone)}
#intro .rule{height:1px;background:var(--edge);margin:12px 0 14px}
#intro p{font-family:var(--serif);font-size:14.5px;line-height:1.6;margin:0 0 11px;color:var(--bone)}
#intro p.q{color:var(--dim);font-style:italic}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--gold);color:#15110d;
 padding:9px 16px;border-radius:0;font-family:var(--serif);font-variant:small-caps;letter-spacing:.06em;
 font-size:13.5px;font-weight:600;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;
 box-shadow:0 2px 10px rgba(0,0,0,.6)}
#toast.s{opacity:1}
</style>
</head>
<body>
<div id="top">
  <div id="res"></div>
  <div id="tabs">
    <button data-t="work" id="tw" class="on">Work</button><button data-t="crew" id="tc">Crew</button>
    <button data-t="craft" id="tf">Craft</button><button data-t="sea" id="ts">Sea</button>
    <button data-t="lore" id="tl">Lore</button><button data-t="quest" id="tq">Tasks</button><button data-t="hall" id="th">Hall</button>
  </div>
</div>
<main id="view"></main>
<div id="toast"></div>
<div id="intro" style="display:none"></div>
<div id="away" style="display:none"></div>
<script>

"use strict";

/* ═════════════════════════════════════════════════════════════
   §1  CONTENT
   Everything here is data. Change these to change the game;
   no rule below reads a number that is not declared in this section.
   ═════════════════════════════════════════════════════════════ */

/* ---------------- data ---------------- */
/* raw, then processed, then product — the order the chain runs, and the order
   every list in the game shows them in */
const SK={forage:"Foraging",fish:"Fishing",wood:"Woodcraft",mine:"Mining",herd:"Husbandry",
 smith:"Smithing",weave:"Weaving",keep:"Preserving",
 cook:"Cooking",sail:"Sailmaking",ship:"Shipwright"};
const TIERS=[["Raw","forage fish wood mine herd"],["Processed","smith weave keep"],["Product","cook sail ship"]]
 .map(([t,k])=>({t,ks:k.split(" ")}));
const craftTier=sk=>TIERS.findIndex(T=>T.ks.includes(sk));   // 0 raw · 1 processed · 2 product
/* raw · processed · product, in the order the chain runs */
const RES=["food","herbs","kelp","fish","timber","bark","ore","clay","wool","horn",
 "salt","charcoal","iron","yarn","cloth","stores","meals","sailcloth","hull","silver"];
const COMP=["amber","ivory","whetstone","glass","silk"];
/* Byproducts: never worked for directly, only turned up now and then by one
   particular way of working. Nothing may be gated behind holding one. */
const RAW_RARE=["herbs","bark","clay","horn"];
/* Each chance find says where it actually came from. Split into verb and the rest
   so a named hand reads right beside you: "You strip bark…" / "Gyða strips bark…" */
const FIND={
 herbs:["turn", "up herbs among the grass"],
 bark: ["strip","bark from the felled trunk"],
 clay: ["dig",  "clay out of the scree"],
 horn: ["bring","in horn from the flock"],
 ivory:["bring","up walrus ivory from the deep water"]
};
const RARITY=["silk","glass","ivory","whetstone","amber"];
const CN={kelp:"Kelp",fish:"Fish",bark:"Bark",clay:"Clay",horn:"Horn",salt:"Salt",
 charcoal:"Charcoal",yarn:"Yarn",sailcloth:"Sailcloth",amber:"Amber",ivory:"Walrus ivory",whetstone:"Eidsborg hone",glass:"Frankish glass",silk:"Eastern silk"};
/* every action is a real-time cycle in seconds */
/* Every craft has more than one thing it can do. The choice is usually a trade:
   a steadier rate against a byproduct you cannot get any other way. */
/* Every craft has more than one thing it can do, and a processor eats faster than
   one gatherer can feed it. Two at the bog to keep one bloom lit — that ratio is the
   shape of the hall. */
const ACT={
 // ── raw ──
 // woods is the first foraging work you start with; shore unlocks later. Kept in
 // that order for tidiness — the Work tab itself orders works and crafts by when
 // they were unlocked (see view_work), so nothing on screen shifts as things open.
 woods:{en:"Walk the woods", sk:"forage",out:{food:2.4},  secs:4.4,xp:9,  rare:{herbs:0.22}},
 shore:{en:"Walk the shore", sk:"forage",out:{food:1.6,kelp:1.0},secs:4.0,xp:9},
 net:  {en:"Set nets",       sk:"fish",  out:{fish:2.4},  secs:5.5,xp:12},
 deep: {en:"Fish the deeps", sk:"fish",  out:{fish:3.0},  secs:7.5,xp:16, rare:{ivory:0.030}},
 hew:  {en:"Hew the coppice",sk:"wood",  out:{timber:2.4},secs:4.5,xp:8},
 fell: {en:"Fell old timber",sk:"wood",  out:{timber:3.2},secs:6.5,xp:12, rare:{bark:0.18}},
 bog:  {en:"Dig the bog",    sk:"mine",  out:{ore:2.0},   secs:5.5,xp:12},
 scree:{en:"Work the scree", sk:"mine",  out:{ore:1.5},   secs:6.0,xp:13, rare:{clay:0.20}},
 tend: {en:"Shear the flock",sk:"herd",  out:{wool:1.6},  secs:5.5,xp:13},
 herd: {en:"Tend the flock", sk:"herd",  out:{wool:1.1},  secs:6.0,xp:14, rare:{horn:0.18}},
 // ── processed: each eats faster than one pair of hands can gather ──
 kiln: {en:"Burn charcoal",  sk:"smith", out:{charcoal:1.6},use:{timber:4.5},secs:5.5,xp:15},
 bloom:{en:"Work the bloom", sk:"smith", out:{iron:1.2},  use:{ore:4.2,charcoal:1.0},secs:6.5,xp:18},
 spin: {en:"Spin yarn",      sk:"weave", out:{yarn:1.7},  use:{wool:2.6},secs:5.0,xp:14},
 loom: {en:"Work the loom",  sk:"weave", out:{cloth:1.0}, use:{yarn:2.8},secs:6.5,xp:19},
 burn: {en:"Burn kelp",      sk:"keep",  out:{salt:1.3},  use:{kelp:2.2},secs:5.0,xp:13},
 smoke:{en:"Salt the fish",  sk:"keep",  out:{stores:1.7},use:{fish:4.0,salt:0.6},secs:5.5,xp:16},
 // ── product ──
 rivet:{en:"Rivet a strake", sk:"ship",  out:{hull:1.0},  use:{timber:5,iron:1.2},secs:8.0,xp:24},
 cook: {en:"Cook a pot",     sk:"cook",  out:{meals:1},   use:{food:9,herbs:1.2},secs:7.0,xp:22},
 sew:  {en:"Sew a sail",     sk:"sail",  out:{sailcloth:1},use:{cloth:2.5,yarn:1.5},secs:9.0,xp:28}
};


const SLOTS={tool:"Tool",garment:"Garment",rune:"Rune-stick",amulet:"Amulet"};
/* recipes — discovered, never all visible at once */
/* Gear. Every craft has a tool line of two tiers; the second cannot be learned
   until the first is, and costs far more of its base material. */
const REC=[
 // — tools, tier one: learned by getting good at the work itself —
 {id:"axe0",  en:"Bound axe",     slot:"tool",sk:"wood",  make:"smith",lv:3, cost:{iron:10},  comp:{}, bonus:{speed:.14,yield:.08}, learn:{sk:"wood",lv:4}},
 {id:"net0",  en:"Bast net",      slot:"tool",sk:"fish",  make:"weave",lv:3, cost:{cloth:8},  comp:{}, bonus:{speed:.14,yield:.08}, learn:{sk:"fish",lv:4}},
 {id:"pick0", en:"Antler pick",   slot:"tool",sk:"mine",  make:"smith",lv:3, cost:{iron:11},  comp:{}, bonus:{speed:.14,yield:.08}, learn:{sk:"mine",lv:4}},
 {id:"bask0", en:"Bark basket",   slot:"tool",sk:"forage",make:"wood", lv:5, cost:{timber:10,bark:3},comp:{}, bonus:{speed:.14,yield:.08}, learn:{sk:"forage",lv:10}},
 {id:"comb0", en:"Horn comb",     slot:"tool",sk:"herd",  make:"wood", lv:6, cost:{timber:12,horn:3},comp:{}, bonus:{speed:.14,yield:.08}, learn:{sk:"herd",lv:10}},
 {id:"tong0", en:"Bone tongs",    slot:"tool",sk:"smith", make:"smith",lv:6, cost:{iron:16},  comp:{}, bonus:{speed:.14,yield:.08}, learn:{sk:"smith",lv:10}},
 {id:"weig0", en:"Clay weights",  slot:"tool",sk:"weave", make:"weave",lv:6, cost:{cloth:6,clay:3}, comp:{}, bonus:{speed:.14,yield:.08}, learn:{sk:"weave",lv:10}},
 {id:"rack0", en:"Salting bench",  slot:"tool",sk:"keep",  make:"wood", lv:6, cost:{timber:34},comp:{}, bonus:{speed:.14,yield:.08}, learn:{sk:"keep",lv:10}},
 {id:"pot0",  en:"Soapstone pot", slot:"tool",sk:"cook",  make:"smith",lv:6, cost:{iron:15},  comp:{}, bonus:{speed:.14,yield:.08}, learn:{sk:"cook",lv:10}},
 {id:"caul0", en:"Caulking iron", slot:"tool",sk:"ship",  make:"smith",lv:6, cost:{iron:18},  comp:{}, bonus:{speed:.14,yield:.08}, learn:{sk:"ship",lv:10}},
 // — tools, tier two: far dearer, and only after the first —
 {id:"axe",   en:"Broad axe",     slot:"tool",sk:"wood",  make:"smith",lv:8, cost:{iron:60},  comp:{whetstone:1}, bonus:{speed:.30,yield:.18},  pre:"axe0"},
 {id:"spear", en:"Fish spear",    slot:"tool",sk:"fish",  make:"smith",lv:8, cost:{iron:55},  comp:{ivory:1},     bonus:{speed:.30,yield:.18},  pre:"net0"},
 {id:"spade", en:"Bog spade",     slot:"tool",sk:"mine",  make:"smith",lv:9, cost:{iron:65},  comp:{whetstone:1}, bonus:{speed:.30,yield:.18},  pre:"pick0"},
 {id:"bask",  en:"Willow basket",  slot:"tool",sk:"forage",make:"wood", lv:10,cost:{timber:150,cloth:20},comp:{amber:1},bonus:{speed:.30,yield:.18},pre:"bask0"},
 {id:"shears",en:"Iron shears",   slot:"tool",sk:"herd",  make:"smith",lv:9, cost:{iron:58},  comp:{whetstone:1}, bonus:{speed:.30,yield:.18},  pre:"comb0"},
 {id:"tongs", en:"Smith's tongs", slot:"tool",sk:"smith", make:"smith",lv:12,cost:{iron:90},  comp:{glass:1},     bonus:{speed:.32,yield:.20}, pre:"tong0"},
 {id:"loomw", en:"Warp-weights",  slot:"tool",sk:"weave", make:"weave",lv:11,cost:{cloth:55}, comp:{amber:1},     bonus:{speed:.28,yield:.22}, pre:"weig0"},
 {id:"pans",  en:"Salt pans",     slot:"tool",sk:"keep",  make:"smith",lv:10,cost:{iron:70},  comp:{glass:1},     bonus:{speed:.30,yield:.18},  pre:"rack0"},
 {id:"pot",   en:"Iron cauldron", slot:"tool",sk:"cook",  make:"smith",lv:10,cost:{iron:75},  comp:{glass:1}, bonus:{speed:.30,yield:.18}, learn:{sk:"cook",lv:20}, pre:"pot0"},
 {id:"rivet", en:"Rivet-set",     slot:"tool",sk:"ship",  make:"smith",lv:12,cost:{iron:110}, comp:{whetstone:2}, bonus:{speed:.30,yield:.20},  pre:"caul0"},
 // — the other three slots, each its own line —
 {id:"wrap0", en:"Plain wrap",    slot:"garment",        make:"weave",lv:3, cost:{cloth:12}, comp:{}, bonus:{all:.04}, learn:{sk:"weave",lv:6}},
 {id:"cloak", en:"Wool cloak",    slot:"garment",        make:"weave",lv:7, cost:{cloth:45}, comp:{amber:1}, bonus:{all:.09}, pre:"wrap0"},
 {id:"kyrtl", en:"Fur kyrtill",   slot:"garment",        make:"weave",lv:12,cost:{cloth:120},comp:{ivory:2}, bonus:{all:.16}, pre:"cloak"},
 {id:"stick0",en:"Notched stick", slot:"rune",           make:"wood", lv:4, cost:{timber:28},comp:{}, bonus:{xp:.12}, learn:{sk:"wood",lv:6}},
 {id:"tally", en:"Tally stick",   slot:"rune",           make:"wood", lv:8, cost:{timber:110},comp:{glass:1}, bonus:{xp:.26}, pre:"stick0"},

 ["garment","rune","amulet"].forEach(sl=>{
  const list=REC.filter(r=>r.slot===sl).sort((a,b)=>a.lv-b.lv);
  const known=list.filter(r=>s.known.includes(r.id));
  const hot=list.some(r=>mk.includes(r.id));
  h+=sect(s,"s_"+sl,SLOTS[sl],(hot?`<span style="color:var(--patina)">●</span> `:"")+`${known.length}/${list.length}`,
    known.map(row).join("")+unknownNote(list), false);
 });

 if(itemCount(s)) h+=sect(s,"unworn","In the hall",
  `${itemCount(s)} piece${itemCount(s)>1?"s":""} · ${Object.values(spare).reduce((a,b)=>a+b,0)} spare`,
  ownedIds(s).map(id=>REC.find(x=>x.id===id)).sort((a,b)=>
    (a.slot===b.slot?0:Object.keys(SLOTS).indexOf(a.slot)-Object.keys(SLOTS).indexOf(b.slot))||recVal(b)-recVal(a))
   .map(r=>{const n=own(s,r.id), sp=spare[r.id]||0;
    return `<div class="row"><span>${r.en} <span class="mono sub">×${n}</span>${
      sp>=n?` <span class="tag" style="border-color:var(--dim)">spare</span>`
      :sp?` <span class="tag" style="border-color:var(--dim)">${sp} spare</span>`
      :` <span class="tag" style="border-color:var(--patina);color:var(--patina)">wanted</span>`}
     <div class="sub">${SLOTS[r.slot]}${r.sk?" · "+SK[r.sk]:""}</div></span>
    <button class="${sp?"":"swap"}" data-sell="${r.id}">break down · ${worth(r)}</button></div>`;}).join("")
  +`<div class="note" style="margin-top:5px">Give them out by tapping a slot on the Crew tab. Breaking one down returns two fifths of the metal or cloth; the rare thing is lost.</div>`,
  Object.keys(spare).length>0);

 h+=sect(s,"rare","Rare things",COMP.filter(k=>s.res[k]>0).length+" of "+COMP.length+" in hand",
  COMP.map(k=>`<div class="row"><span>${CN[k]}</span><span class="mono">${s.res[k]||0}</span></div>`).join("")
  +`<div class="note" style="margin-top:6px">These cannot be made. Only found, traded, or taken.</div>`, false);
 return h;
}
function view_sea(s){
 let h="";
 // ── the kaupstefna: only open where you have just landed, and only for a while ──
 if(s.markets.length){
  s.markets.forEach((mk,mi)=>{ const p=portDef(mk.port);
   const rareRows=COMP.filter(k=>s.res[k]>0).map(k=>
     `<div class="row"><span>Sell <b>${CN[k]}</b> <span class="mono sub">×${s.res[k]}</span>
        <div class="sub">${rarePrice(s,p,k)} silver each${seaDef(p.sea).reach>=1?" · a rich market pays well":""}</div></span>
       <button class="take" data-sellrare="${mi}|${k}">sell one</button></div>`).join("");
   h+=sect(s,"mk_"+mk.port,`Kaupstefna — ${p.en}`,`open <span id="mkt${mi}">${dur(mk.left)}</span>`,
    (mk.offers.length?mk.offers.map((o,oi)=>{
      const can=o.kind==="sell"?(s.res[o.res]||0)>=o.qty:s.res.silver>=o.silver;
      return `<div class="row"><span>${o.kind==="sell"?`Sell <b>${o.qty} ${o.res}</b>`:`Buy <b>${o.qty} ${o.res}</b>`}
        <div class="sub">${o.kind==="sell"?`they give ${o.silver} silver · you have ${f(s.res[o.res]||0)}`:`they ask ${o.silver} silver`}</div></span>
        <button class="${o.kind==="sell"&&can?"take":""}" data-trade="${mi}|${oi}" ${can?"":"disabled"}>${o.kind==="sell"?"sell":"buy"}</button></div>`;
    }).join(""):`<div class="note">The stalls are traded out.</div>`)
    +(rareRows?`<div class="sub" style="color:var(--gold);margin:7px 0 2px">Rare things you have brought home</div>`+rareRows:"")
    +`<div class="note" style="margin-top:5px">Rare things can be sold here but never bought — the sea is their only source. The stalls close when the market's time runs out.</div>`,
    true);
  });
 }
 h+=pilotCard(s);
 const idle=s.fleet.map((sh,i)=>({sh,i})).filter(x=>!tripOf(s,x.i));
 // ── the fleet ──
 if(!s.fleet.length){
  h+=`<div class="card"><h2>No ship on the sand</h2><div class="note">${s.unlocked.includes("rivet")
    ?"Build a færing on the slipway below — twenty hull and eight sailcloth — and the home waters open to you."
    :"You do not yet know how a strake is riveted. Learn the shipwright's hand first."}</div></div>`;
 } else {
  h+=`<div class="card"><h2>Your fleet <span class="sub mono">${s.fleet.length} ship${s.fleet.length>1?"s":""}${s.trips.length?` · ${s.trips.length} at sea`:""}</span></h2>`+
   s.fleet.map((sh,i)=>{ const d=shipDef(sh.tier), t=tripOf(s,i); let body;
    if(t&&t.home){ const p=portDef(t.dest);
     body=`<div class="sub" style="color:var(--patina)">Home from ${p.en.toLowerCase()} — ${haulText(t.haul||{silver:0,comps:{}})}</div>
      <button class="take" data-land="${i}" style="margin-top:6px;width:100%">unload her</button>`;
    } else if(t){ const p=portDef(t.dest);
     body=`<div class="sub">On ${p.en.toLowerCase()} · <span id="vt${i}">${dur(t.left)}</span> to the sand</div>
      <div class="bar sm" style="margin-top:4px"><i id="vb${i}" style="width:${pct(t.tot-t.left,t.tot)}%;background:var(--frost)"></i></div>`;
    } else { const need=mendNeed(sh), short=mendShort(s,sh);
     // name everything she wants, and redden what is not in the hall
     const wants=Object.entries(need).filter(([,v])=>v>0).map(([k,v])=>{
      const lack=short.includes(k);
      return `<span style="${lack?"color:var(--rust)":""}">${v} ${resName(k)}${lack?` — you have ${f(s.res[k]||0)}`:""}</span>`;}).join(" · ");
     body=`<div class="bar sm"><i id="cnd${i}" style="width:${sh.cond}%;background:${sh.cond<35?"var(--rust)":"var(--patina)"}"></i></div>
      <div class="sub" style="margin-top:5px">${sh.cond>=99?"Sound and tarred, on the sand.":`Mending wants ${wants}.`}</div>`+
      (sh.cond<99?`<button data-mend="${i}" style="margin-top:6px;width:100%" ${short.length?"disabled":""}>mend her</button>`:"")+
      `<button data-scrap="${i}" style="margin-top:5px;width:100%;background:transparent;box-shadow:none;min-height:36px;font-size:11px;border:0;border-top:1px dashed ${scrapArm===i?"var(--rust)":"var(--edge)"};color:${scrapArm===i?"var(--rust)":"var(--dim)"}">${scrapArm===i?"sure? — break her up":"break her up"}${scrapHull(sh)>0?` · +${scrapHull(sh)} hull`:""}</button>`;
    }
    const perks=[d.cargo>1?`${Math.round((d.cargo-1)*100)}% more in the hold`:"",d.speed>1?`${Math.round((d.speed-1)*100)}% quicker`:"",d.wear<1?`wears ${Math.round((1-d.wear)*100)}% slower`:""].filter(Boolean).join(" · ");
    return `<div style="margin:9px 0 2px;border-top:1px solid var(--edge);padding-top:8px">
      <div class="hd"><span class="nm">${d.en}</span><span class="lv">${Math.round(sh.cond)}/100${!t&&sh.cond<25?' <span style="color:var(--rust)">failing</span>':""}</span></div>
      ${perks?`<div class="sub" style="color:var(--patina)">${perks}</div>`:`<div class="sub">the smallest hull — home waters only</div>`}
      ${body}</div>`;
   }).join("")+`</div>`;
 }
 // ── the slipway ──
 if(s.unlocked.includes("rivet")){
  const capN=fleetCap(s), atCap=s.fleet.length>=capN;
  h+=`<div class="card"><h2>The slipway <span class="sub mono">${s.fleet.length}/${capN} ship${capN>1?"s":""}</span></h2>`+
   (atCap?`<div class="note" style="color:var(--rust)">Your strand holds ${capN} ship${capN>1?"s":""}. Read <b>more keels</b> (Sea lore) or take <b>a wider strand</b> (ørlǫg) to keep more.</div>`
    :SHIPS.filter(d=>canBuildShip(s,d.id)).map(d=>{
      const can=Object.keys(d.build).every(k=>(s.res[k]||0)>=d.build[k]);
      const cost=Object.entries(d.build).map(([k,v])=>`<span style="color:${(s.res[k]||0)>=v?"var(--patina)":"var(--rust)"}">${v} ${k}</span>`).join('<span style="color:var(--dim)"> · </span>');
      const reachTxt=["the home waters","the western and northern waters","the eastern way"][d.reach];
      const perks=[d.cargo>1?`${Math.round((d.cargo-1)*100)}% more in the hold`:"",d.speed>1?`${Math.round((d.speed-1)*100)}% quicker`:"",d.wear<1?`wears ${Math.round((1-d.wear)*100)}% slower`:""].filter(Boolean).join(" · ");
      return `<div class="row"><span>${d.en}<div class="sub">reaches ${reachTxt}${perks?" · "+perks:""}</div><div class="sub">${cost}</div></span>
       <button class="${can?"take":""}" data-build="${d.id}" ${can?"":"disabled"}>build</button></div>`;
    }).join(""))+`</div>`;
 }
 // ── the waters: opened in turn, each fully charted before the next ──
 if(s.fleet.length){
  SEAS.forEach((sea,si)=>{
   const unlocked=seaUnlocked(s,sea.id), canReach=fleetReach(s)>=sea.reach;
   const ports=portsBySea(sea.id), openCount=ports.filter(p=>portOpen(s,p.id)).length;
   const complete=seaComplete(s,sea.id);
   const luck=hallFortune(s);
   const m=(1+luck*0.5)*RX.silver();
   let tag="";
   if(!unlocked) tag=` <span class="tag">chart all of ${SEAS[si-1].en.toLowerCase()} first</span>`;
   else if(!canReach) tag=` <span class="tag">${sea.reach===1?"wants a knarr":"wants a longship"}</span>`;
   else if(complete) tag=` <span class="tag" style="border-color:var(--patina);color:var(--patina)">fully charted</span>`;
   const body = !unlocked
    ? `<div class="note">The waters open in turn — finish charting ${SEAS[si-1].en.toLowerCase()}, and this one is yours to try.</div>`
    : ports.map(p=>{
      if(!portOpen(s,p.id)){ const fr=frontierPort(s,sea.id);
       return `<div class="row"><span style="color:var(--dim)">${p.en} <span class="tag">uncharted</span>
         <div class="sub">${canReach?`A chart from ${fr?fr.en.toLowerCase():"the deepest water here"} may open her.`:"Farther than your ships can reach."}</div></span></div>`;
      }
      const shr=shareOf(s,p);
      const senders=canReach?idle.filter(x=>shipCanSail(x.sh,p.id)):[];
      const lowStores=s.res.stores<p.stores;
      const fitFor=x=>fitOf(s,p,x.sh);                         // fit now varies by the ship you send
      const fits=senders.map(fitFor), cheapest=fits.length?Math.min(...fits):fitOf(s,p), dearest=fits.length?Math.max(...fits):cheapest;
      const btns=senders.length?senders.map(x=>{
        const fit=fitFor(x), worn=x.sh.cond<p.wear+10, ok=!lowStores&&s.res.silver>=fit&&!worn;
        // the ship's own voyage time (÷ her speed), so a faster hull reads as faster here
        const label=(s.fleet.length>1?shipDef(x.sh.tier).en.toLowerCase():"sail")+" · "+dur(voyMs(s,x.sh,p));
        return `<button data-sail="${p.id}|${x.i}" ${ok?"":"disabled"}>${label}</button>`;
      }).join(""):`<span class="sub" style="color:var(--dim)">${canReach?"no ship free":"—"}</span>`;
      // if she can't be sent, say why — the shared shortages first, then a worn hull
      const why=[];
      if(canReach&&senders.length){
        if(lowStores)why.push(`wants ${p.stores} stores, ${f(s.res.stores)} in hand`);
        if(!lowStores&&s.res.silver<cheapest)why.push(`wants ${nfm(cheapest)} silver to fit, ${nfm(s.res.silver)} in the purse`);
        if(!lowStores&&s.res.silver>=cheapest&&senders.every(x=>x.sh.cond<p.wear+10))why.push("every free ship is too worn — mend one first");
      }
      const cr=short=>short?"var(--rust)":"var(--dim)";
      return `<div class="row"><span>${p.en}
        <div class="sub">${dur(p.mins*60000*VOY_SCALE*RX.voy())} · <span style="color:${cr(lowStores)}">${p.stores} stores</span> · <span style="color:${cr(fits.length&&s.res.silver<cheapest)}">${nfm(cheapest)}${dearest>cheapest?"–"+nfm(dearest):""} to fit</span> · they take ${Math.round(shr*100)}%</div>
        <div class="sub">${Math.round(p.silver[0]*m)}–${Math.round(p.silver[1]*m)} silver · ~${Math.round(p.wear*RX.wear())} cond · ${Object.keys(p.comp).map(k=>`<span class="tag amber">${CN[k]} ${Math.round(rareChance(p.comp[k],RX.rare()*luckMult(k,luck))*100)}%</span>`).join("")}</div>
        ${why.length?`<div class="sub" style="color:var(--rust)">${why.join(" · ")}</div>`:""}</span>
        <span class="give" style="max-width:52%">${btns}</span></div>`;
     }).join("");
   h+=sect(s,"sea_"+sea.id, sea.en+tag, `${openCount}/${ports.length}`, body, unlocked&&canReach&&!complete);
  });
 }
 return h;
}
/* Lore — what is being read, and what may be */
function view_lore(s){
 let h="";
  h+=`<div class="card"><div class="hd"><span class="nm">Lore</span><span class="lv">rank ${loreRank(s)} · reading ${s.studies.length}/${studySlots(s)}</span></div>`;
  if(s.studies.length) h+=s.studies.map((st,i)=>{const r=RSCH.find(x=>x.id===st.id);
    if(st.ready) return `<div class="q ready" style="margin-top:8px"><div class="row" style="padding:0">
      <span><span class="t">${r.en} ${ROM[LT(s,r.id)]}</span>
       <div class="sub">${r.eff(LT(s,r.id)+1)}</div></span>
      <button class="take" data-lore="${i}">take it</button></div></div>`;
    return `<div style="margin-top:8px"><div class="sub">${r.en} ${ROM[LT(s,r.id)]} — <span id="lcd${i}">${dur(st.left)}</span></div>
     <div class="bar sm"><i id="lb${i}" style="width:${pct(st.tot-st.left,st.tot)}%"></i></div></div>`;}).join("");
  else h+=`<div class="note" style="margin-top:6px">Nothing is being read. Reading goes on while you work, and while the app is shut.</div>`;
  h+=`</div>`;
  ["Forge lore","Sea lore","Hall lore"].forEach(br=>{
   const list=RSCH.filter(r=>r.br===br);
   const bodyRows=list.map(r=>{
    const t=LT(s,r.id), maxed=loreMax(s,r), reading=s.studies.some(x=>x.id===r.id);
    const gated=!maxed&&loreRank(s)<r.rank;
    const c=loreCost(s,r);
    const tok=Object.entries(c).map(([k,v])=>({t:`${v} ${CN[k]?CN[k].toLowerCase():k}`,ok:(s.res[k]||0)>=v}));
    const line=tok.map(x=>`<span style="color:${x.ok?"var(--patina)":"var(--rust)"}">${x.t}</span>`)
      .join('<span style="color:var(--dim)"> \u00b7 </span>');
    const can=!maxed&&!gated&&!reading&&s.studies.length<studySlots(s)&&tok.every(x=>x.ok);
    const foot = maxed ? `<span style="color:var(--patina)">read to the end</span>`
      : reading ? `<span style="color:var(--frost)">being read now</span>`
      : gated ? `<span style="color:var(--rust)">wants rank ${r.rank}, you are ${loreRank(s)}</span>`
      : `<span style="color:var(--dim)">${dur(loreMins(s,r)*60000)}</span><span style="color:var(--dim)"> \u00b7 </span>${line}`;
    return `<div class="row" style="${maxed?"opacity:.55":""}"><span>${r.en}${t?` <span class="mono" style="color:var(--gold)">${ROM[t-1]}</span>`:""}
     <div class="sub">${maxed?r.eff(t):r.eff(Math.min(r.tiers,t+1))}</div>
     <div class="sub">${foot}</div></span>
     ${maxed?"":`<button data-study="${r.id}" ${can?"":"disabled"}>read</button>`}</div>`;}).join("");
   const have=list.reduce((a,r)=>a+LT(s,r.id),0), all=list.reduce((a,r)=>a+r.tiers,0);
   const readable=list.some(r=>loreOpen2(s,r)&&Object.entries(loreCost(s,r)).every(([k,v])=>(s.res[k]||0)>=v));
   h+=sect(s,"lore_"+br.replace(/\s/g,""),br,`${have}/${all}`+(readable?` <span style="color:var(--patina)">·</span>`:""),
     bodyRows+`<div class="bar sm" style="margin-top:7px"><i style="width:${have/all*100}%;background:var(--gold)"></i></div>`,
     readable);
  });
 
 return h;
}
/* Tasks — the four bands, the road, and the marks */
function view_quest(s){
 let h="";
  const iq=INTRO[s.intro];
  h+=`<div class="card" style="${introReady(s)?"border-color:var(--gold)":""}">
   <h2>The way on <span class="sub mono">${Math.min(s.intro+1,INTRO.length)} of ${INTRO.length}</span></h2>`+
   (iq?(()=>{ const v=Math.min(iq.n,iq.val(s)), rdy=introReady(s);
     const rw=Object.entries(iq.r).map(([k,x])=>k==="comp"?CN[x]:`${x} ${k}`).join(" · ");
     return `<div class="q ${rdy?"ready":""}"><div class="t">${iq.t}</div>
      ${iq.n>1?`<div class="p">${nfm(v)} / ${nfm(iq.n)}</div>
      <div class="bar sm"><i id="ib" style="width:${pct(v,iq.n)}%"></i></div>`:""}
      <div class="row" style="padding-top:5px"><span class="r">${rw}</span>
       ${rdy?`<button class="take" data-intro="1">take it</button>`:""}</div></div>`;})()
    :`<div class="note">The road is walked. Everything now is of your own choosing.</div>`)+
   `<div class="bar sm" style="margin-top:6px"><i style="width:${s.intro/INTRO.length*100}%;background:var(--frost)"></i></div></div>`;
  const bandCard=(b)=>{
   const cap=bandCap(s,b), list=s.q[b];
   const full=list.length>=cap;
   const wait=!BAND[b].every?`<span class="mono sub">stands through the fire</span>`
    :full?`<span class="mono sub" style="color:var(--gold)">full — take some</span>`
    :`<span class="mono sub">next in <span id="cd${b}">${dur(BAND[b].every-s.qt[b])}</span></span>`;
   let out=list.length?"":`<div class="note">Nothing waiting. Work gathers while you are away.</div>`;
   out+=list.map((q,i)=>{
    const pv=Math.min(q.n,trackVal(s,q.tr)-q.base);
    const pay = b==="er"?`${q.pay.n} ${q.pay.res}${q.silver?" · "+q.silver+" silver":""}`
      : b==="dy"?`${q.silver} silver`
      : b==="ch"?`${q.orlog} ørlǫg`
      : `choose one of three: ${liveChoices(s,q).map(choiceLabel).join(" · ")}`;
    let foot;
    if(q.done&&b==="se"){
     foot=`<div class="give" style="max-width:100%;justify-content:flex-start;margin-top:6px">`+
      liveChoices(s,q).map((c,ci)=>
       `<button class="take" data-coll="${b}|${i}|${ci}" style="text-align:left">${choiceLabel(c)}</button>`).join("")+`</div>`;
    } else {
     foot=`<div class="row" style="padding-top:5px"><span class="r">${pay}</span>`+
      (q.done?`<button class="take" data-coll="${b}|${i}|0">take it</button>`
        :b==="ch"?"":(()=>{const armed=swapArm===(b+"|"+i);return `<button class="swap${armed?" arm":""}" data-rr="${b}|${i}" ${s.res.silver>=rerollCost(s)?"":"disabled"}>${armed?"sure?":"swap"} · ${rerollCost(s)}</button>`;})())+`</div>`;
    }
    return `<div class="q ${q.done?"ready":""}"><div class="t">${q.t}</div>
     <div class="p"><span id="qp${b}${i}">${nfm(pv)}</span> / ${nfm(q.n)}</div>
     <div class="bar sm"><i id="qb${b}${i}" style="width:${pct(pv,q.n)}%"></i></div>${foot}</div>`;}).join("");
   return sect(s,"band_"+b,BAND[b].en,`${list.length}/${cap} ${wait}`,out,true);
  };
  ["er","dy","se","ch"].forEach(b=>{h+=bandCard(b);});
  const rows=MARK.map(m=>{
   const done=markDone(s,m),ready=markReady(s,m),t=markTier(s,m);
   const val=markVal(s,m),next=markNext(s,m);
   return {m,done,ready,t,val,next,frac:done?1:Math.min(1,val/next)};
  }).sort((a,b)=>(b.ready-a.ready)||(a.done-b.done)||(b.frac-a.frac));
  const nr=rows.filter(r=>r.ready).length;
  const taken=rows.reduce((a,r)=>a+r.t,0), total=MARK.reduce((a,m)=>a+m.tiers.length,0);
  h+=sect(s,"marks","Marks",`${taken} of ${total} taken`,
   (nr?`<div class="note" style="color:var(--gold);margin-bottom:7px">${nr} waiting to be taken.</div>`:"")+
   rows.map(r=>{const m=r.m;
    if(r.done) return `<div class="q done" style="border-left-color:var(--patina)">
      <div class="row" style="padding:0"><span><span class="t">${m.t} ${ROM[m.tiers.length-1]}</span>
       <div class="sub">every tier taken · ${nfm(r.val)} ${m.d}</div></span></div></div>`;
    const rw=markReward(s,m);
    return `<div class="q ${r.ready?"ready":""}" style="${r.ready?"":"border-left-color:var(--line)"}">
     <div class="row" style="padding:0"><span><span class="t">${m.t} ${ROM[r.t]}</span>
      <div class="sub">${nfm(r.val)} / ${nfm(r.next)} ${m.d}</div></span>
      ${r.ready?`<button class="take" data-mark="${m.id}">take it</button>`
        :`<span class="sub" style="color:var(--gold)">${rw.silver?rw.silver+" silver":rw.orlog+" ørlǫg"}</span>`}</div>
     <div class="bar sm"><i style="width:${r.frac*100}%;background:${r.ready?"var(--patina)":"var(--gold)"}"></i></div></div>`;}).join(""), nr>0);
 
 return h;
}
/* Hall — stores, ørlǫg, the reckoning, and keeping a copy */
function view_hall(s){
 let h="";
  if(s.picking){
   const cap=shelterCap(s),list=shelterables(s);
   h+=`<div class="card act"><h2>What comes through the fire</h2>
    <div class="note">Líf and Lífþrasir hid inside the tree and the world came back greener.
    Choose ${cap} thing${cap>1?"s":""}. Everything else is lost — skills, silver, the hall, the boat.</div>
    <div class="sub" style="margin-top:7px;color:var(--gold)">${s.picks.length} of ${cap} chosen · this reckoning leaves you ${orlPayout(s)} ørlǫg</div>

 }).join("")+`</div>`+slotPicker(s,who);
}
/* Tapping a slot opens a list of what would fit it, best first. */
function slotPicker(s,who){
 const p=s.pick; if(!p||p.who!==String(who))return "";
 const eq=who==="me"?s.eq:s.crew[who].eq;
 const sk=who==="me"?null:s.crew[who].sk;
 const fits=ownedIds(s).map(id=>REC.find(x=>x.id===id))
   .filter(r=>r&&r.slot===p.slot&&(!r.sk||who==="me"||r.sk===sk))
   .sort((a,b)=>recVal(b)-recVal(a));
 const wornId=eq[p.slot];
 // mark the best one for a crew hand — their list all serves one craft, so the top by
 // worth is the right pick (for you the list mixes crafts, so no single "best")
 const wornVal=wornId?recVal(REC.find(x=>x.id===wornId)):-1;
 const bestId=who!=="me"&&fits.length&&recVal(fits[0])>wornVal?fits[0].id:null;
 return `<div class="card" style="margin-top:7px;border-color:var(--gold)">
  <div class="hd"><span class="nm">${SLOTS[p.slot]} for ${who==="me"?"you":s.crew[who].name}</span>
   <span class="lv"><button data-pickoff="" style="min-height:34px;padding:5px 11px">done</button></span></div>
  ${wornId?`<div class="row"><span>${REC.find(x=>x.id===wornId).en} <span class="tag" style="border-color:var(--patina);color:var(--patina)">worn</span></span>
    <button class="swap" data-unslot="${p.slot}" data-w="${who}">take it off</button></div>`:""}
  ${fits.length?fits.map(r=>`<div class="row"><span>${r.en} <span class="mono sub">×${own(s,r.id)}</span>${r.id===bestId?` <span class="tag" style="border-color:var(--gold);color:var(--gold)">best</span>`:""}
    <div class="sub">${r.sk?SK[r.sk]+" · ":""}${Object.entries(r.bonus).map(([k,v])=>`+${Math.round(v*100)}% ${k}`).join(", ")}</div></span>
   <button class="${!bestId||r.id===bestId?"take":""}" data-eq="${r.id}" data-w="${who}">put on</button></div>`).join("")
   :`<div class="note">Nothing in the hall would fit that${sk?" and serve "+SK[sk].toLowerCase():""}.</div>`}</div>`;
}
function fire(t){
 const d=t.dataset;
 if(d.t){tab=d.t;lastSig="";maybeDraw();paint();}
 else if(d.act)setAct(d.act,d.who==="me"?"me":+d.who);
 else if(d.hire)hire(+d.hire);
 else if(d.fire!==undefined)dismiss(+d.fire);
 else if(d.sell)sell(d.sell);
 else if(d.seek)seek();
 else if(d.slot!==undefined){ S.pick=(S.pick&&S.pick.who===d.w&&S.pick.slot===d.slot)?null:{who:d.w,slot:d.slot}; lastSig=""; maybeDraw(); }
 // closing the slot picker (S.pick, a cursor) — not to be confused with sheltering
 // something through the fire (s.picks, a list). Both once answered to data-pick,
 // and this branch, coming first, swallowed every tap meant for the other.
 else if(d.pickoff!==undefined){ S.pick=null; lastSig=""; maybeDraw(); }
 else if(d.unslot){ unequip(d.w==="me"?"me":+d.w,d.unslot); lastSig=""; maybeDraw(); }
 else if(d.rest!==undefined){ const c=S.crew[+d.rest]; if(c){ c.rest=!c.rest;
   log(`${c.name} is ${c.rest?"set down":"back at the "+ACT[c.act].en.toLowerCase()}.`,"b"); lastSig=""; maybeDraw(); } }
 else if(d.flow){ S.flow=S.flow===d.flow?null:d.flow; tab="work"; lastSig=""; maybeDraw(); }
 else if(d.sect){ S.shut=S.shut||{};
   const nowShut=/▸/.test(t.closest("[data-sect]").innerHTML);
   S.shut[d.sect]=!nowShut; lastSig=""; maybeDraw(); }
 else if(d.word) putWord(d.word);
 else if(d.study)study(d.study);
 else if(d.lore!==undefined)takeLore(+d.lore);
 else if(d.coll){const[b,i,c]=d.coll.split("|");collect(b,+i,+(c||0));}
 else if(d.rr){const[b,i]=d.rr.split("|");reroll(b,+i);}
 else if(d.mark)claimMark(d.mark);
 else if(d.intro)claimIntro();
 else if(d.craft)craft(d.craft);
 else if(d.eq){equip(d.eq,d.w==="me"?"me":+d.w); S.pick=null; lastSig=""; maybeDraw();}
 else if(d.un)unequip(d.w==="me"?"me":+d.w,d.un);
 else if(d.trade!==undefined){const[mi,oi]=d.trade.split("|");doTrade(+mi,+oi);}
 else if(d.sellrare){const[mi,k]=d.sellrare.split("|");sellRare(+mi,k);}
 else if(d.sail){const[pid,fi]=d.sail.split("|");sail(pid,+fi);}
 else if(d.build)buildShip(d.build);
 else if(d.land!==undefined){const fi=+d.land;const ti=S.trips.findIndex(t=>t.ship===fi&&t.home);if(ti>=0)land(ti);}
 else if(d.mend!==undefined)mend(+d.mend);
 else if(d.scrap!==undefined)scrapShip(+d.scrap);
 else if(d.table)setTable();
 else if(d.auto){ if(!S.auto)S.auto={}; S.auto[d.auto]=autoOn(S,d.auto)?0:1; lastSig=""; maybeDraw(); }
 else if(d.feast)feast();
 else if(d.hall)upHall();
 else if(d.pick)togglePick(d.pick);
 else if(d.orl)buyOrl(d.orl);
 else if(d.aim){S.goal=S.goal===d.aim?null:d.aim;lastSig="";maybeDraw();}
 else if(d.sp){speed=+d.sp;maybeDraw();}
 else if(t.id==="openrag"){S.picking=true;S.picks=[];lastSig="";maybeDraw();}
 else if(t.id==="cancelrag"){S.picking=false;S.picks=[];lastSig="";maybeDraw();}
 else if(t.id==="dorag")reckon();
 else if(t.id==="fresh") bringItIn();
 else if(t.id==="dlsv") downloadSave();
 else if(t.id==="expt"){ const b=document.getElementById("savebox");
   b.value=exportSave(); S.kept=Date.now(); b.focus(); b.select();
   try{ b.setSelectionRange(0,b.value.length); }catch(_){}
   try{ navigator.clipboard.writeText(b.value); toast("Copied — keep it somewhere safe"); }
   catch(_){ toast("It is selected — copy it"); } }
 else if(t.id==="impt") readIn();
 else if(t.id==="introok"){ S.seen=1; delete S.away; drawIntro(); lastSig=""; maybeDraw(); }
 else if(t.id==="awayok"){ delete S.away; drawAway(); }
 else if(t.id==="rst"){
   if(!rstArmed){ rstArmed=true; clearTimeout(rstT);
    rstT=setTimeout(()=>{rstArmed=false;lastSig="";maybeDraw();},5000);
    toast("Tap again to burn it all — this cannot be undone");
    lastSig="";maybeDraw(); return; }
   clearTimeout(rstT); rstArmed=false;
   wipeSave();S=fresh();for(const k in _c)delete _c[k];rollDaily();rollWeekly();rollOffers();
   lastSig="";log("Begin again.","b");maybeDraw();paint();}
}
/* Input.
   The browser's own click event already knows the difference between a tap and a
   scroll, so let it decide. All we have to do is make sure the button still exists
   when the click lands: freeze rebuilding from the moment a finger touches a button
   until shortly after. */
let thawT=null,rstArmed=false,rstT=null;
function freeze(){ holding=true; clearTimeout(thawT); thawT=setTimeout(thaw,1200); }
function thaw(){ clearTimeout(thawT); holding=false;
 if(pendingDraw){pendingDraw=false;maybeDraw();} }
const HIT="button,[data-slot],[data-sect],[data-flow],[data-un],[data-act]";
try{ document.body.style.cursor="pointer"; }catch(_){}

/* Taps fire on release, not on the browser's synthesised click.
   Safari withholds a click whenever anything under the finger changes between
   press and release — and paint() changes numbers ten times a second — so the
   click never came and the tap was simply lost. Pointer events always arrive. */
let downOn=null, downX=0, downY=0, firedAt=0, lastScroll=0;
function doTap(t){
 if(!t||t.disabled) return;
 if(Date.now()-lastScroll<250) return;   // a tap in the wake of a scroll is almost always a mis-hit
 firedAt=Date.now();
 freeze();
 // choosing a work must look instant, even though the rebuild is held back
 if(t.dataset.act&&t.dataset.who==="me"){
  try{document.querySelectorAll("[data-act][data-who='me']").forEach(b=>
   b.classList.toggle("on",b===t));}catch(_){}
 }
 fire(t);
 try{paint();}catch(_){}
 clearTimeout(thawT); thawT=setTimeout(thaw,70);
}
/* A finger is never still. Anything under about fifteen pixels is a tap, not a
   scroll — and we act on what was pressed, not on whatever happens to be under
   the finger when it lifts, since the row beneath may have been redrawn. */
const TAP_SLOP=15;
document.addEventListener("pointerdown",e=>{
 downOn=e.target.closest(HIT); downX=e.clientX; downY=e.clientY;
 if(downOn) freeze();
},{passive:true});
// once the finger travels past the slop it is a scroll, not a tap — drop the pending
// press now so neither pointerup nor Safari's scroll-time pointercancel can fire it
document.addEventListener("pointermove",e=>{
 if(downOn&&Math.hypot(e.clientX-downX,e.clientY-downY)>TAP_SLOP) downOn=null;
},{passive:true});
// remember when the page last scrolled, so a tap riding a scroll's tail is ignored
window.addEventListener("scroll",()=>{ lastScroll=Date.now(); },{passive:true});
document.addEventListener("pointerup",e=>{
 const moved=Math.hypot(e.clientX-downX,e.clientY-downY);
 if(downOn&&moved<=TAP_SLOP) doTap(downOn);
 else { clearTimeout(thawT); thawT=setTimeout(thaw,120); }
 downOn=null;
},{passive:true});
/* Safari cancels a touch the moment it suspects a scroll. If the finger never
   really moved, that was a tap and we honour it. */
document.addEventListener("pointercancel",e=>{
 const moved=Math.hypot((e.clientX||downX)-downX,(e.clientY||downY)-downY);
 if(downOn&&moved<=TAP_SLOP) doTap(downOn);
 downOn=null; clearTimeout(thawT); thawT=setTimeout(thaw,120);
},{passive:true});
// keyboards and any browser without pointer events still get here
document.addEventListener("click",e=>{
 if(Date.now()-firedAt<700) return;      // already handled on release
 doTap(e.target.closest(HIT));
});
/* ---------------- go ---------------- */
/* ---------------- keeping and catching up ----------------
   localStorage is blocked inside the artifact sandbox, so every call is wrapped —
   the game simply runs without saving here, and saves the moment the file is
   opened from anywhere else (a downloaded copy, or somewhere it is hosted). */
const SAVEKEY="hall.save", HORIZON=14*3600*1000;
/* The save version is the shape of a fresh state, not a number I have to remember
   to raise. Add or rename a field and old saves are refused by themselves. */
const SAVEVER=(()=>{ const k=Object.keys(fresh()).sort().join(",");
 let h=0; for(let i=0;i<k.length;i++){h=(h*31+k.charCodeAt(i))>>>0;}
 return "s"+h.toString(36); })();
let canSave=false;
try{ localStorage.setItem("hall.probe","1"); localStorage.removeItem("hall.probe"); canSave=true; }catch(_){}
function saveGame(){ if(!canSave)return;
 try{ S.savedAt=Date.now(); localStorage.setItem(SAVEKEY,JSON.stringify({v:SAVEVER,s:S})); }catch(_){}}
function exportSave(){
 try{ S.savedAt=Date.now();
  const blob=btoa(unescape(encodeURIComponent(JSON.stringify({v:SAVEVER,s:S}))));
  return blob; }catch(_){ return ""; }
}
/* Reading a hall back in. On iOS, long-pressing to paste into the little box is
   fiddly and the pasted text often can't be made to stick, so a tap here reads
   the clipboard straight off (works on https, within this tap's gesture) when
   the box is empty — copy a hall on any device, tap "read one in", done. Falls
   back to whatever is already in the box, or asks you to paste if all else fails. */
async function readIn(){
 const b=document.getElementById("savebox");
 let txt=b?b.value.trim():"";
 if(!txt){
  try{ txt=((await navigator.clipboard.readText())||"").trim(); if(b&&txt)b.value=txt; }
  catch(_){ /* no clipboard permission / not supported — fall through */ }
 }
 if(!txt){ if(b)b.focus(); toast("Copy a hall first, or paste one into the box"); return; }
 // importSave writes the hall to storage; open it in place rather than reloading —
 // iOS home-screen apps don't reliably reload, which left this stuck on "opening it".
 if(importSave(txt)){ toast("Hall read in"); openSaved(); }
}
/* Load whatever is in storage into the running game and redraw — the boot sequence,
   minus the page load. Used after reading a hall in, so no navigation is needed. */
function openSaved(){
 S=fresh();
 const ok=loadGame();
 if(ok){ catchUp(); if(!S.offers||!S.offers.length)rollOffers(); }
 else { rollDaily(); rollWeekly(); rollOffers(); }
 for(const k in _c)delete _c[k];   // force every cached panel to redraw for the new hall
 last=performance.now(); lastSig=""; maybeDraw(); paint();
}
function importSave(txt){
 try{
  const d=JSON.parse(decodeURIComponent(escape(atob(txt.trim()))));
  if(!d||!d.s)throw 0;
  if(d.v!==SAVEVER){ toast("That hall was built to another plan"); return false; }
  localStorage.setItem(SAVEKEY,JSON.stringify(d));
  return true;
 }catch(_){ toast("That is not a hall"); return false; }
}
function downloadSave(){
 try{
  const txt=exportSave();
  const d=new Date(), pad=n=>String(n).padStart(2,"0");
  const name=`hall-age${S.age||0}-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.txt`;
  const url=URL.createObjectURL(new Blob([txt],{type:"text/plain"}));
  const a=document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  S.kept=Date.now();
  toast("Saved to your downloads");
 }catch(_){ toast("Could not write the file — copy it out instead"); }
}
function wipeSave(){ if(!canSave)return; try{ localStorage.removeItem(SAVEKEY); }catch(_){}}
function loadGame(){ if(!canSave)return false;
 try{ const raw=localStorage.getItem(SAVEKEY); if(!raw)return false;
  const d=JSON.parse(raw);
  const base=fresh(), old=d.s;
  if(!old||!old.res){ log("The old hall could not be read.","b"); return false; }
  // carry a pre-fleet hall forward: the one boat becomes a færing, its voyage a trip
  if(old.fleet===undefined && (old.boat!==undefined||old.voy!==undefined)){
   old.fleet = old.boat ? [{tier:"faering", cond:(old.cond==null?100:old.cond), last:(portDef(old.lastPort)?old.lastPort:null)}] : [];
   old.trips = (old.voy && portDef(old.voy.id)) ? [{ship:0,dest:old.voy.id,left:old.voy.left,tot:old.voy.tot,home:!!old.voy.home,haul:old.voy.haul||null}] : [];
   old.opened = old.opened||{}; old.sailed = Array.isArray(old.sailed)?old.sailed:[];
   delete old.boat; delete old.cond; delete old.voy; delete old.lastPort;
   log("The plan of the sea has changed — your boat is drawn up on the sand as a færing.","b");
  }
  // a save made before a field existed must not arrive missing it
  for(const k in base) if(old[k]===undefined) old[k]=base[k];
  ["ev","life","lev","q","qt","orl","marks","mseen","lore","res","tot","xp","eq"].forEach(k=>{
   if(typeof base[k]==="object"&&base[k]&&!Array.isArray(base[k])){
    old[k]=old[k]||{};
    for(const kk in base[k]) if(old[k][kk]===undefined) old[k][kk]=base[k][kk];
   }});
  (old.crew||[]).forEach(c=>{ c.eq=c.eq||blankEq(); c.xp=c.xp||{}; });
  S=old; return true;
 }catch(_){ return false; } }

function snap(){ const o={res:{},lv:{}};
 [...RES,...COMP].forEach(k=>o.res[k]=S.res[k]||0);
 Object.keys(SK).forEach(k=>o.lv[k]=myL(S,k));
 o.lore=loreRank(S); o.done=["er","dy","se","ch"].reduce((a,b)=>a+S.q[b].filter(q=>q.done).length,0);
 o.voy=(S.ev.voyages||0); o.mends=(S.ev.mends||0); o.meals=S.res.meals||0;
 return o; }

function catchUp(){
 if(!S.savedAt)return;
 const away=Math.min(HORIZON,Date.now()-S.savedAt);
 if(away<60000||!S.seen)return;
 const before=snap(); S.lost={};
 const chunk=away>6*3600000?300000:60000;      // coarser chunks for a long absence
 let left=away; while(left>0){ const d=Math.min(chunk,left); advance(d); left-=d; }
 const after=snap(), hrs=away/3600000;
 const gained=[...RES,...COMP].map(k=>[k,after.res[k]-before.res[k]])
   .filter(([k,v])=>v>0.5).sort((a,b)=>b[1]-a[1]).slice(0,4)
   .map(([k,v])=>`${nfm(v)} ${k}`).join(", ");
 const rose=Object.keys(SK).filter(k=>after.lv[k]>before.lv[k])
   .map(k=>`${SK[k]} ${after.lv[k]}`).join(", ");
 const lost=Object.entries(S.lost||{}).filter(([,v])=>v>1).sort((a,b)=>b[1]-a[1]).slice(0,3)
   .map(([k,v])=>`${nfm(v)} ${k}`).join(", ");
 const idle=S.crew.filter((c,i)=>{ if(i>=HALL[S.hall].crew)return true;
   const r=runner(S,c); return r&&r.a.use&&Object.keys(r.a.use).some(k=>S.res[k]<eUse(r.a,r.yld,k)); })
   .map(c=>c.name);
 // what the things you bought actually did while you were gone
 const sailed=after.voy-before.voy, mended=after.mends-before.mends;
 // a ship the tiller could not send out again sits on the sand
 let boat=null;
 const stuck=S.fleet.find((sh,i)=>!tripOf(S,i)&&sh.last);
 if(TIER(S,"tiller")&&stuck){
  const p=portDef(stuck.last)||PORTS[0];
  boat = S.res.stores<p.stores ? "stores" : stuck.cond<p.wear+10 ? "worn" : "idle";
 }
 const board=TIER(S,"board")?(atTable(S)?"set":"bare"):null;
 S.away={hrs,gained,rose,lost,idle,waiting:after.done-before.done,
  home:S.trips.some(t=>t.home), studies:(S.studies||[]).filter(x=>x.ready).length, unpaid:!!S.unpaid,
  sailed,mended,boat,board,meals:Math.round(S.res.meals||0)};
 const bits=[];
 if(gained)bits.push(gained);
 if(rose)bits.push("and rose to "+rose);
 log(`You were away ${hrs<1?Math.round(hrs*60)+" minutes":hrs.toFixed(1)+" hours"}. ${bits.join(" ")||"Little changed."}`,"b");
 if(lost)log(`${lost} was lost for want of room. Raise the hall, or read wide eaves.`,"bad");
 if(idle.length)log(`${idle.join(", ")} stood idle — no materials, or no room under the roof.`,"bad");
 if(after.done>before.done)log(`${after.done-before.done} piece${after.done-before.done>1?"s":""} of work now waiting to be taken.`,"y");
 toast(`Away ${hrs<1?Math.round(hrs*60)+"m":hrs.toFixed(1)+"h"} — ${gained||"little changed"}`);
 delete S.lost;
}

S=fresh();
const resumed=loadGame();
if(!resumed){ rollDaily();rollWeekly();rollOffers(); }
log("You alone on a cold shore, with nothing and no one. Choose your own work to begin.","b");
log("A woman named Ásta waits at the gate, but you have no silver for her yet.");
// catchUp already advances the clock, which spawns work at the proper rate.
// topping up here would hand you a full board on every reload.
if(resumed){ catchUp(); if(!S.offers||!S.offers.length)rollOffers(); }
last=performance.now();maybeDraw();paint();
setInterval(tick,100);
// coming back to a backgrounded tab is not a reload, so nothing caught up the idle time
// and the browser throttled the tick to nothing. Catch up on the way back in, the same
// as a fresh load would, then re-anchor the clock so the next tick does not double-count.
function resume(){ if(!canSave)return; catchUp(); last=performance.now(); saveGame(); maybeDraw(); paint(); }
if(canSave){
 setInterval(saveGame,10000);
 document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden")saveGame(); else resume(); });
 window.addEventListener("focus",resume);
 window.addEventListener("pageshow",e=>{ if(e.persisted)resume(); });   // iOS restores from the bfcache without a reload
 window.addEventListener("pagehide",saveGame);
 window.addEventListener("beforeunload",saveGame);
}

/* ---------------- keeping the app fresh ----------------
   Added to a phone's home screen this runs as a standalone web app, and iOS
   holds onto the cached page hard — even a force-quit and relaunch can still
   show an old build. So on launch, and each time the app is brought back to the
   front, ask the network — bypassing every cache — what build is live. If it is
   newer than the one running, a bar drops down offering a one-tap refresh that
   loads the fresh page (a fresh URL, so the cache can't serve the old one).
   Offline or blocked, it stays silent and you keep playing on what you have. */
let freshT=0, freshHtml=null;
async function checkFresh(){
 if(location.protocol==="file:")return;                    // a local test copy — nothing to fetch
 if(Date.now()-freshT<30000)return; freshT=Date.now();     // at most once every 30s
 try{
  const r=await fetch(location.pathname+"?_fresh="+Date.now(),{cache:"no-store"});
  if(!r.ok)return;
  const txt=await r.text();
  const m=txt.match(/const BUILD="([^"]+)"/);
  if(m&&m[1]&&m[1]!==BUILD){ freshHtml=txt; showFresh(m[1]); }   // keep the fresh page in hand
 }catch(_){}
}
function showFresh(v){
 if(document.getElementById("fresh"))return;
 // a real button, so it rides the same tap path as everything else — a plain div's
 // click can be swallowed on iOS and the bar looked dead
 const b=document.createElement("button"); b.id="fresh"; b.type="button";
 b.style.cssText="position:fixed;left:0;right:0;top:0;z-index:9999;width:100%;border:0;"
  +"padding:calc(10px + env(safe-area-inset-top)) 14px 10px;text-align:center;cursor:pointer;"
  +"background:var(--gold);color:var(--ink);font:600 13px/1.35 'IBM Plex Sans',system-ui,sans-serif;"
  +"box-shadow:0 2px 12px rgba(0,0,0,.55);min-height:0";
 b.innerHTML=`A new build (${v}) has landed — <b>tap to bring it in</b>`;
 document.body.appendChild(b);
}
/* iOS home-screen apps won't reliably navigate or reload, so don't try — we already
   fetched the fresh page, so write it straight into the document in place. */
function bringItIn(){
 try{ if(canSave)saveGame(); }catch(_){}
 if(freshHtml){ try{ document.open(); document.write(freshHtml); document.close(); return; }catch(_){} }
 try{ location.reload(); }catch(_){}
}
checkFresh();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible")checkFresh(); });
window.addEventListener("focus",checkFresh);
window.addEventListener("pageshow",checkFresh);
// the real fix for home-screen staleness: a network-first service worker (sw.js) that
// serves the freshest build on every launch, so the app updates itself with no tap.
// The bar above stays as a fallback for a build that lands while you are already in.
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
 navigator.serviceWorker.register("sw.js").catch(()=>{});
}

</script>
